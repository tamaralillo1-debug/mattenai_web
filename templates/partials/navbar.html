<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
            Mattenai
        </a>

        <div class="d-flex gap-2 align-items-center flex-wrap">
            <a class="btn btn-outline-dark btn-sm" href="{% url 'home' %}">
                Inicio
            </a>

            <a class="btn btn-outline-dark btn-sm" href="{% url 'catalogo' %}">
                Catálogo
            </a>

            <a class="btn btn-outline-dark btn-sm" href="{% url 'ver_carrito' %}">
                Carrito
            </a>

            {% if user.is_authenticated %}
                <span class="small text-muted">
                    Hola, {{ user.username }}
                </span>

                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger btn-sm">
                        Cerrar sesión
                    </button>
                </form>
            {% else %}
                <a class="btn btn-dark btn-sm" href="{% url 'login' %}">
                    Ingresar
                </a>
            {% endif %}

            {% if user.is_staff %}
                <a class="btn btn-warning btn-sm" href="/admin/">
                    Admin
                </a>
            {% endif %}
        </div>
    </div>
</nav>
